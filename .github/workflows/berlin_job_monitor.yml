name: Berlin Job Application Monitor (Indeed)

on:
  schedule:
    # 12:00 PM Berlin CET (11:00 UTC) and 6:00 PM Berlin CET (17:00 UTC)
    - cron: '0 11,17 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub Actions

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Monitor Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_pipeline.py

      - name: Commit & Push New Drafts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add vacantes_para_enviar/ jobs_tracker.db
          if git diff --staged --quiet; then
            echo "No hay nuevas vacantes para hacer commit."
          else
            git commit -m "chore(drafts): nuevas vacantes detectadas en Berlín [skip ci]"
            git push
          fi
